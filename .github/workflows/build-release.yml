name: Build and Release Kaygez

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Backend (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o x-ui-linux-amd64 -ldflags="-s -w" main.go

      - name: Build Backend (arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build -o x-ui-linux-arm64 -ldflags="-s -w" main.go

      - name: Package amd64
        run: |
          mkdir -p x-ui
          cp x-ui-linux-amd64 x-ui/x-ui
          cp -r bin x-ui/
          cp x-ui.sh x-ui/
          cp x-ui.service.* x-ui/ || true
          tar -czf x-ui-linux-amd64.tar.gz x-ui

      - name: Package arm64
        run: |
          rm -rf x-ui
          mkdir -p x-ui
          cp x-ui-linux-arm64 x-ui/x-ui
          cp -r bin x-ui/
          cp x-ui.sh x-ui/
          cp x-ui.service.* x-ui/ || true
          tar -czf x-ui-linux-arm64.tar.gz x-ui

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            x-ui-linux-amd64.tar.gz
            x-ui-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kaygez-binaries
          path: |
            x-ui-linux-amd64.tar.gz
            x-ui-linux-arm64.tar.gz
