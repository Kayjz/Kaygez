name: Kaygez Release Policy Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-policy:
    name: Verify release configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify stable release configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="$(tr -d '[:space:]' < internal/config/version)"

          test -n "$VERSION" || (echo "missing version" && exit 1)
          test -x packaging/release/build-linux-amd64.sh
          test -f .github/workflows/build-release.yml

          echo "Kaygez release version: $VERSION"
          echo "Release assets are built by .github/workflows/build-release.yml."
          echo "Official XTLS/Xray-core is downloaded and verified by SHA-256 at build time."
